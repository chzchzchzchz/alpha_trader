kalshi:
  demo: true
  key_id: ${KALSHI_API_KEY_ID}
  key_file: ${KALSHI_API_KEY_FILE}
capital:
  initial_balance: 500
  max_open_positions: 10
  max_daily_loss: 50
strategies:
  near_zero:
    enabled: true
    price_ceiling: 0.15
    min_volume_24h: 100
    min_days_to_close: 1
    max_days_to_close: 30
    target_multiplier: 3.0
    stop_loss_frac: 0.4
    max_contracts: 5
    min_smart_money_vol: 3
  category_specialist:
    enabled: true
    min_trades_per_category: 10
    min_win_rate: 0.55
    blacklist_win_rate: 0.4
    max_categories: 5
    contracts_per_trade: 5
    confidence_multiplier: 1.5
  convergence:
    enabled: true
    min_price_cents: 60
    max_price_cents: 96
    max_days_to_resolution: 14
    min_volume_usd: 10000
    max_spread_bps: 200
    max_recent_spike_pct: 8
    max_cluster_fraction: 0.25
    base_position_pct: 0.005
    min_filter_score: 0.6
    max_open_positions: 10
  late_window:
    enabled: false
    entry_window_seconds: 15
    entry_threshold: 96
    trade_size_usdc: 3.0
    max_open: 5
    trigger_mode: false
    trigger_price: 0.7
    trigger_minutes: 3.0
    exit_price: 0.9
  longshot:
    enabled: false
    min_price_cents: 1
    max_price_cents: 8
    min_volume_usd: 500
    min_days_to_resolution: 1
    max_days_to_resolution: 30
    max_positions: 10
    usdc_per_position: 2.0
    target_price: 0.5
  flash_crash:
    enabled: false
    poll_interval_seconds: 5
    drop_threshold: 0.25
    window_seconds: 30
    take_profit: 0.15
    stop_loss: 0.08
    size_usdc: 2.0
    max_open: 3
  panic_sniper:
    enabled: true
    drop_threshold: 0.20
    recent_window: 300
    min_price_before_drop: 30
    max_recovery_window: 1800
    size_usdc: 5.0
    max_open: 8
  time_sniper:
    enabled: true
    min_spread_cents: 12
    min_volume: 20
    max_open: 5
    size_usdc: 5.0
  overreaction_reversal:
    enabled: true
    move_threshold: 0.25
    baseline_window: 1800
    entry_delay: 120
    size_usdc: 10.0
    max_open: 3
  smart_money:
    enabled: true
    whale_threshold_contracts: 50
    whale_threshold_usdc: 100
    min_trades_to_confirm: 2
    max_open: 6
    size_usdc: 3.0
schedule:
  polling_interval: 60
  category_refresh_interval: 3600
logging:
  level: INFO
  file: logs/kalshi.log
  max_file_size: 10485760
  backup_count: 5
